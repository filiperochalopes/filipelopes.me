services:
  frontend:
    container_name: filipelopesme_frontend
    restart: always
    build: frontend
    ports:
      - 3012:3000
    volumes:
      - ./frontend:/home/node/app
      - /home/node/app/node_modules
    links:
      - djangoapp
  djangoapp:
    container_name: filipelopesme_backend
    restart: always
    build: api
    ports:
      - 8060:8000
    volumes:
      - ./api:/usr/src/app
    command: python django_rest_api/manage.py runserver 0.0.0.0:8000
  nginx:
    container_name: filipelopesme_nginx
    restart: always
    image: nginx:1.16.0-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 3050:80
    depends_on:
      - frontend
      - djangoapp
