services:
  frontend:
    container_name: filipelopesme_frontend
    restart: always
    build: frontend
    ports:
      - 3012:3000
    volumes:
      - ./frontend:/home/node/app
      - /home/node/app/node_modules
  nginx:
    container_name: filipelopesme_nginx
    restart: always
    image: nginx:1.16.0-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 3050:80
    depends_on:
      - frontend
